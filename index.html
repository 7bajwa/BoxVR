<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BOXFLOW</title>
  <meta name="description" content="BOXFLOW — VR boxing rhythm trainer for Meta Quest 3 (WebXR) and the browser.">
  <meta name="theme-color" content="#05070d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body data-state="menu">
  <div id="stage"></div>
  <div id="flash"></div>
  <div id="pts"></div>

  <div id="splash"><h1>BOXFLOW</h1><p>Loading…</p></div>

  <button id="enterVR" class="vr-pill" hidden>🥽 ENTER VR</button>
  <button id="pauseBtn" class="round" aria-label="Pause">❚❚</button>
  <p id="note"></p>

  <footer id="hud">
    <div id="hProgressWrap"><div id="hProgress"></div></div>
    <div class="cell big"><small>SCORE</small><span id="hScore">0</span></div>
    <div class="cell"><small>STREAK</small><span id="hStreak" class="g">0</span><em id="hMult">×1</em>
      <i id="hPips"><b></b><b></b><b></b></i></div>
    <div class="cell"><small>NEXT</small><span id="hNext">R UPPER</span></div>
    <div class="cell"><small>LONGEST CHAIN</small><span id="hLongest" class="y">0</span></div>
    <div class="cell"><small id="hTimeLabel">TIME</small><span id="hTime" class="c">00:00</span></div>
    <div class="cell" id="hSpeedCell"><small>SPEED</small><span id="hSpeed" class="o">1.0×</span></div>
  </footer>
  <nav id="pads"></nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
